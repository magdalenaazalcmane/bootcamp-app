services:
  - type: web
    name: bootcamp-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
